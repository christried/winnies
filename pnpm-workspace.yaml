shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # @babel/core requires semver@^6.3.1, and 6.3.1 (2023-07-10, final 6.x) predates
  # npm provenance — so no-downgrade flags it next to the attested 7.x releases.
  # Verified: lockfile integrity matches the registry tarball exactly. Not a takeover.
  - semver@6.3.1

allowBuilds:
  # esbuild's install script fetches the platform-specific binary. Vite needs it.
  esbuild: true
  unrs-resolver: false
