name: CI

on:
  pull_request:
  # Every pushed branch, not only main: an implementer's branch has no PR, and `scripts/ci-wait.mjs` waits for its run
  # before the orchestrator merges it (docs/agents/implementer-frame.md). A branch with a PR runs twice per push;
  # Actions minutes are free on a public repo.
  push:
    branches: ["**"]

# A new push to a PR cancels the in-flight run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Job-level, not step-level. `nuxt.config.ts` imports `server/utils/env.ts`,
    # so *any* command that loads the Nuxt config validates the environment —
    # including `nuxt prepare`, which runs as a postinstall hook during
    # `pnpm install`. Scoping these to the build step only makes install fail
    # before the build is ever reached.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      # Not a secret and not meaningful in CI — the build only checks it parses.
      NUXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build test
        run: pnpm test:build

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The test database as service containers: Postgres, and Neon's WebSocket proxy in front of it (the
    # Neon driver the app uses only speaks WebSocket). Same images as compose.test.yaml, which says why;
    # scripts/harness-sync.test.mjs fails the `check` job when they, their environment or the ports differ.
    # Only the proxy is reached from the steps; it reaches Postgres by service name.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: winnies_test
        options: >-
          --health-cmd "pg_isready -U postgres -d winnies_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/winnies_test
        ports:
          - 4444:4444

    # Plain literals, no `secrets.*`: the API tests never see a production value. Job-level for the same
    # reason as in `check`: `nuxt prepare` runs on install and validates all six app variables. The five
    # of HARNESS_ENV in tests/support/env.ts are repeated here and in `e2e`; scripts/harness-sync.test.mjs
    # fails the `check` job when a copy differs.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/winnies_test
      # Only has to parse, for `nuxt prepare`; nothing connects to it. The harness gives the build and the
      # server TEST_DATABASE_URL as their DATABASE_URL, and refuses to run if the two were the same.
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      BETTER_AUTH_SECRET: winnies-test-secret-not-a-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3101
      DISCORD_CLIENT_ID: test-discord-client-id
      DISCORD_CLIENT_SECRET: test-discord-client-secret
      NUXT_PUBLIC_APP_URL: http://localhost:3101

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API tests
        run: pnpm test:api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The pinned image of ADR-0004: its browsers belong to one Playwright version, which must be the repo's
    # @playwright/test. scripts/playwright-pin.test.mjs fails the `check` job when the two differ.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host --init

    # The same test database as `api-tests` (scripts/harness-sync.test.mjs checks it). In a container job the
    # services are reached by their name and need no published ports.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: winnies_test
        options: >-
          --health-cmd "pg_isready -U postgres -d winnies_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/winnies_test

    # Plain literals, no `secrets.*`, the same as in `api-tests` bar the host of TEST_DATABASE_URL
    # (scripts/harness-sync.test.mjs checks that too).
    env:
      # The host is the proxy's service name, not localhost: tests/support/neon-local.mjs dials the proxy
      # at the host of this URL (and refuses any host but `localhost` and `neon-proxy`).
      TEST_DATABASE_URL: postgres://postgres:postgres@neon-proxy:5432/winnies_test
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      BETTER_AUTH_SECRET: winnies-test-secret-not-a-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3101
      DISCORD_CLIENT_ID: test-discord-client-id
      DISCORD_CLIENT_SECRET: test-discord-client-secret
      NUXT_PUBLIC_APP_URL: http://localhost:3101

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The image has Python but no compiler, and `better-sqlite3` is built by node-gyp on install.
      - name: Install a compiler
        run: apt-get update && apt-get install -y --no-install-recommends build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `playwright install`: the image carries the browsers.
      - name: e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Read-only on purpose: this job compares against the committed baselines and never writes or pushes one. Baselines
    # come out of `pnpm test:visual:podman --update` on the maintainer's machine, in this same image (ADR-0004).
    permissions:
      contents: read

    # The same pinned image as `e2e`, so a pass under Podman is a pass here: font rasterization is the whole point.
    # scripts/playwright-pin.test.mjs fails the `check` job when either image and `@playwright/test` differ.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host --init

    env:
      # Set by Actions already; explicit because a missing baseline must fail here, never be written (Vitest writes the
      # reference it did not find unless CI is set).
      CI: "true"
      # What scripts/visual-env.mjs reads: the suite and its baselines belong to the pinned image.
      WINNIES_VISUAL: container

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Storybook and Vitest build nothing, so there is no compiler step, and `nuxt prepare` (the postinstall hook) needs
      # the app's environment, which this job does not have. The same install scripts/visual-container.sh runs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Story render, axe and the screenshots in one run, against the baselines in stories/__screenshots__.
      - name: Screenshot tests
        run: pnpm test:visual

      # The new picture and a diff image of each failed comparison.
      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: .vitest/attachments/
          retention-days: 14
          if-no-files-found: ignore
