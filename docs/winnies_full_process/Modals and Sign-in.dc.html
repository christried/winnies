<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>body{margin:0;background:#EFE6EA}a{color:#B0175A}a:hover{color:#4A2B3A}</style>
</helmet>
<section ref="{{ rootRef }}" style="display:flex;flex-direction:column;gap:72px;padding:80px;font-family:'M PLUS Rounded 1c',sans-serif;color:#4A2B3A">
  <div style="display:flex;flex-direction:column;gap:10px;max-width:1200px">
    <span style="font:800 15px/1 'M PLUS Rounded 1c';color:#B0175A">Phase 5b</span>
    <h1 style="margin:0;font:400 56px/1.2 'Mochiy Pop One'">Modals and sign-in</h1>
    <p style="margin:0;font:500 20px/1.5 'M PLUS Rounded 1c';color:#7A5C6A;text-wrap:pretty">13 states in light and dark at 1440 wide, each a working prototype running its P4 motion. Type, submit, retry and sign in in any frame. Create Winnie also opens from the header in every signed-in frame.</p>
  </div>
  <sc-for list="{{ states }}" as="s" hint-placeholder-count="2">
    <div id="{{ s.n }}" data-frame="{{ s.n }}" data-screen-label="{{ s.label }}" style="display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">
        <span style="font:400 22px/1 'Mochiy Pop One';padding:8px 14px;border-radius:18px;background:#FF6FAE;color:#4A2B3A">{{ s.n }}</span>
        <h2 style="margin:0;font:400 30px/1.3 'Mochiy Pop One'">{{ s.t }}</h2>
        <span style="font:600 18px/1.4 'M PLUS Rounded 1c';color:#7A5C6A">{{ s.d }}</span>
      </div>
      <div style="display:flex;gap:48px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font:800 15px 'M PLUS Rounded 1c';color:#7A5C6A">Light</span>
          <div data-half="{{ s.kl }}" style="width:1440px;min-height:1000px;border-radius:24px;overflow:hidden;background:#FFF4F8;box-shadow:0 20px 50px -20px rgba(74,43,58,.35)"><sc-if value="{{ s.onL }}" hint-placeholder-val="{{ false }}"><dc-import name="WinniesWorkspace" scenario="{{ s.s }}" theme="light" hint-size="1440px,1000px"></dc-import></sc-if></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font:800 15px 'M PLUS Rounded 1c';color:#7A5C6A">Dark</span>
          <div data-half="{{ s.kd }}" style="width:1440px;min-height:1000px;border-radius:24px;overflow:hidden;background:#231520;box-shadow:0 20px 50px -20px rgba(74,43,58,.35)"><sc-if value="{{ s.onD }}" hint-placeholder-val="{{ false }}"><dc-import name="WinniesWorkspace" scenario="{{ s.s }}" theme="dark" hint-size="1440px,1000px"></dc-import></sc-if></div>
        </div>
      </div>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  rootRef = React.createRef();
  state = { on: {} };
  componentDidMount() {
    this._f = () => { if (!this._raf) this._raf = requestAnimationFrame(() => { this._raf = 0; this.scan(); }); };
    window.addEventListener('scroll', this._f, true); window.addEventListener('resize', this._f);
    this._iv = setInterval(() => this.scan(), 400);
    this.scan();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this._f, true); window.removeEventListener('resize', this._f); clearInterval(this._iv); cancelAnimationFrame(this._raf); }
  scan() {
    const r = this.rootRef.current; if (!r) return;
    const vw = window.innerWidth, vh = window.innerHeight, on = this.state.on, next = {}, add = [];
    r.querySelectorAll('[data-half]').forEach((el) => {
      const k = el.dataset.half, b = el.getBoundingClientRect(); if (!k || !b.width) return;
      const near = b.bottom > -vh * 0.75 && b.top < vh * 1.75 && b.right > -vw * 0.5 && b.left < vw * 1.5;
      const far = b.bottom < -vh * 2.5 || b.top > vh * 3.5 || b.right < -vw * 2 || b.left > vw * 3;
      if (on[k]) { if (!far) next[k] = true; } else if (near) add.push([Math.abs(b.top + b.height / 2 - vh / 2) + Math.abs(b.left + b.width / 2 - vw / 2), k]);
    });
    const now = Date.now();
    if (add.length && now - (this._last || 0) > 450) { add.sort((a, b) => a[0] - b[0]); next[add[0][1]] = true; this._last = now; }
    const a = Object.keys(on), b = Object.keys(next);
    if (a.length !== b.length || b.some((k) => !on[k])) this.setState({ on: next });
  }
  renderVals() {
    const S = [
      ['13a', 'Create Winnie', 'create', 'Empty, with placeholder and today’s quota. Enter submits, Esc cancels.'],
      ['13b', 'Create Winnie · name required', 'create-required', 'Submitted empty. Field shakes, message says what to do.'],
      ['13c', 'Create Winnie · name too long', 'create-long', '39 / 30. Counter turns red while typing, message on submit.'],
      ['13d', 'Create Winnie · daily quota reached', 'create-quota', '10 per day. The form is replaced, nothing to fill in.'],
      ['13e', 'Create Winnie · busy', 'create-busy', 'Field and buttons locked, spinner in the primary.'],
      ['14a', 'Delete Winnie', 'delete', 'Opens from the Winnie overflow. Count is live.'],
      ['14b', 'Delete Winnie · busy', 'delete-busy', 'Esc, scrim and Cancel are locked until it finishes.'],
      ['14c', 'Delete Winnie · error', 'delete-error', 'Nothing removed. Primary becomes Try again, which succeeds here.'],
      ['15a', 'Signed out', 'signed-out', 'Discord only. Click it to sign in and land on the welcome state.'],
      ['15b', 'Signed out · redirecting', 'signed-out-busy', 'Pressed, spinner, label says where you’re going.'],
      ['15c', 'Signed out · two providers', 'signed-out-two', 'Twitch sits beside Discord. While one redirects, the other dims.'],
      ['16a', 'Not found', 'not-found', 'Any unknown URL. Shown with the signed-in header.'],
      ['16b', 'Something went wrong', 'server-error', 'Same page for server errors. Try again returns to the Workspace.'],
    ];
    return { rootRef: this.rootRef, states: S.map(([n, t, s, d]) => ({ n, t, s, d, label: n + ' ' + t, kl: n + 'l', kd: n + 'd', onL: !!this.state.on[n + 'l'], onD: !!this.state.on[n + 'd'] })) };
  }
}
</script>
</body>
</html>
