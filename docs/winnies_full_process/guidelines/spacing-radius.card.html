<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#FFE3EC}.pane{padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--color-page);color:var(--color-text);font-family:var(--font-body)}.lbl{font:800 11px/1.2 var(--font-body);color:var(--color-text-muted)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr}code{font:700 11px/1.3 ui-monospace,Menlo,monospace;color:var(--color-text-muted)}.sw{display:flex;flex-direction:column;gap:4px;width:96px}.sw i{height:56px;border-radius:18px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}table{border-collapse:collapse;width:100%;font:600 12px/1.3 var(--font-body)}td,th{padding:5px 8px;text-align:left;border-bottom:1px solid var(--color-border)}th{font-weight:800;color:var(--color-text-muted)}</style></head><body class="w-root"><div class="pane"><div class="row" style="align-items:flex-end"><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:4px;height:4px;background:var(--color-accent);border-radius:4px"></span><code>1·4</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:8px;height:8px;background:var(--color-accent);border-radius:4px"></span><code>2·8</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:12px;height:12px;background:var(--color-accent);border-radius:4px"></span><code>3·12</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:14px;height:14px;background:var(--color-accent);border-radius:4px"></span><code>3-5·14</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:16px;height:16px;background:var(--color-accent);border-radius:4px"></span><code>4·16</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:22px;height:22px;background:var(--color-accent);border-radius:4px"></span><code>5-5·22</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:24px;height:24px;background:var(--color-accent);border-radius:4px"></span><code>6·24</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:30px;height:30px;background:var(--color-accent);border-radius:4px"></span><code>7-5·30</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:40px;height:40px;background:var(--color-accent);border-radius:4px"></span><code>10·40</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:48px;height:48px;background:var(--color-accent);border-radius:4px"></span><code>12·48</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:56px;height:56px;background:var(--color-accent);border-radius:4px"></span><code>14·56</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:64px;height:64px;background:var(--color-accent);border-radius:4px"></span><code>16·64</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:80px;height:80px;background:var(--color-accent);border-radius:4px"></span><code>20·80</code></div></div><div class="row"><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:88px;height:52px;background:var(--color-surface);box-shadow:var(--shadow-raised);border-radius:10px"></span><code>xs·10</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:88px;height:52px;background:var(--color-surface);box-shadow:var(--shadow-raised);border-radius:14px"></span><code>sm·14</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:88px;height:52px;background:var(--color-surface);box-shadow:var(--shadow-raised);border-radius:20px"></span><code>md·20</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:88px;height:52px;background:var(--color-surface);box-shadow:var(--shadow-raised);border-radius:24px"></span><code>lg·24</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:88px;height:52px;background:var(--color-surface);box-shadow:var(--shadow-raised);border-radius:30px"></span><code>xl·30</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:88px;height:52px;background:var(--color-surface);box-shadow:var(--shadow-raised);border-radius:38px"></span><code>2xl·38</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:88px;height:52px;background:var(--color-surface);box-shadow:var(--shadow-raised);border-radius:48px"></span><code>3xl·48</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:88px;height:52px;background:var(--color-surface);box-shadow:var(--shadow-raised);border-radius:52px"></span><code>4xl·52</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:88px;height:52px;background:var(--color-surface);box-shadow:var(--shadow-raised);border-radius:999px"></span><code>pill·999</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="w-nini" style="--nini-workspace:70px"></span><code>mochi</code></div></div></div></body></html>
