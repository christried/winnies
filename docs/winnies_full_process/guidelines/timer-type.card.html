<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#FFE3EC}.pane{padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--color-page);color:var(--color-text);font-family:var(--font-body)}.lbl{font:800 11px/1.2 var(--font-body);color:var(--color-text-muted)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr}code{font:700 11px/1.3 ui-monospace,Menlo,monospace;color:var(--color-text-muted)}.sw{display:flex;flex-direction:column;gap:4px;width:96px}.sw i{height:56px;border-radius:18px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}table{border-collapse:collapse;width:100%;font:600 12px/1.3 var(--font-body)}td,th{padding:5px 8px;text-align:left;border-bottom:1px solid var(--color-border)}th{font-weight:800;color:var(--color-text-muted)}</style></head><body class="w-root"><div class="pane"><div class="row" style="gap:28px"><span class="w-timer w-timer--total" data-state="running"><span>1</span><span>4</span><span class="sep">:</span><span>3</span><span>2</span><span class="sep">:</span><span>1</span><span>3</span></span><code>--timer-total-size</code></div><div class="row" style="gap:28px"><span class="w-timer w-timer--overlay" ><span>1</span><span>4</span><span class="sep">:</span><span>3</span><span>2</span><span class="sep">:</span><span>1</span><span>3</span></span><code>--timer-overlay-size</code><span class="w-timer " data-state="running"><span>3</span><span class="sep">:</span><span>1</span><span>2</span><span class="sep">:</span><span>4</span><span>4</span></span><code>--timer-row-size</code></div><code>Render each character in its own span (width var(--timer-digit-w) / var(--timer-colon-w)); Mochiy has no tabular figures, so slots keep ticking digits from shifting.</code></div></body></html>
