<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>body{margin:0;background:#EFE6EA}a{color:#B0175A}a:hover{color:#4A2B3A}</style>
</helmet>
<section ref="{{ rootRef }}" style="display:flex;flex-direction:column;gap:72px;padding:80px;font-family:'M PLUS Rounded 1c',sans-serif;color:#4A2B3A">
  <div style="display:flex;flex-direction:column;gap:10px;max-width:1200px">
    <span style="font:800 15px/1 'M PLUS Rounded 1c';color:#B0175A">Phase 5a</span>
    <h1 style="margin:0;font:400 56px/1.2 'Mochiy Pop One'">Workspace · signed-in /</h1>
    <p style="margin:0;font:500 20px/1.5 'M PLUS Rounded 1c';color:#7A5C6A;text-wrap:pretty">18 states in light and dark at 1440 wide. Each frame is a working prototype running its P4 motion. Click, type, drag and open menus in any frame.</p>
  </div>
  <sc-for list="{{ states }}" as="s" hint-placeholder-count="2">
    <div id="{{ s.n }}" data-frame="{{ s.n }}" data-screen-label="{{ s.label }}" style="display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">
        <span style="font:400 22px/1 'Mochiy Pop One';padding:8px 14px;border-radius:18px;background:#FF6FAE;color:#fff">{{ s.n }}</span>
        <h2 style="margin:0;font:400 30px/1.3 'Mochiy Pop One'">{{ s.t }}</h2>
        <span style="font:600 18px/1.4 'M PLUS Rounded 1c';color:#7A5C6A">{{ s.d }}</span>
      </div>
      <div style="display:flex;gap:48px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font:800 15px 'M PLUS Rounded 1c';color:#7A5C6A">Light</span>
          <div data-half="{{ s.kl }}" style="width:1440px;min-height:{{ s.ph }};border-radius:24px;overflow:hidden;background:#FFF4F8;box-shadow:0 20px 50px -20px rgba(74,43,58,.35)"><sc-if value="{{ s.onL }}" hint-placeholder-val="{{ false }}"><dc-import name="WinniesWorkspace" scenario="{{ s.s }}" theme="light" hint-size="1440px,1000px"></dc-import></sc-if></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font:800 15px 'M PLUS Rounded 1c';color:#7A5C6A">Dark</span>
          <div data-half="{{ s.kd }}" style="width:1440px;min-height:{{ s.ph }};border-radius:24px;overflow:hidden;background:#231520;box-shadow:0 20px 50px -20px rgba(74,43,58,.35)"><sc-if value="{{ s.onD }}" hint-placeholder-val="{{ false }}"><dc-import name="WinniesWorkspace" scenario="{{ s.s }}" theme="dark" hint-size="1440px,1000px"></dc-import></sc-if></div>
        </div>
      </div>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  rootRef = React.createRef();
  state = { on: {} };
  componentDidMount() {
    this._f = () => { if (!this._raf) this._raf = requestAnimationFrame(() => { this._raf = 0; this.scan(); }); };
    window.addEventListener('scroll', this._f, true); window.addEventListener('resize', this._f);
    this._iv = setInterval(() => this.scan(), 400);
    this.scan();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this._f, true); window.removeEventListener('resize', this._f); clearInterval(this._iv); cancelAnimationFrame(this._raf); }
  scan() {
    const r = this.rootRef.current; if (!r) return;
    const vw = window.innerWidth, vh = window.innerHeight, on = this.state.on, next = {}, add = [];
    r.querySelectorAll('[data-half]').forEach((el) => {
      const k = el.dataset.half, b = el.getBoundingClientRect(); if (!k || !b.width) return;
      const near = b.bottom > -vh * 0.75 && b.top < vh * 1.75 && b.right > -vw * 0.5 && b.left < vw * 1.5;
      const far = b.bottom < -vh * 2.5 || b.top > vh * 3.5 || b.right < -vw * 2 || b.left > vw * 3;
      if (on[k]) { if (!far) next[k] = true; } else if (near) add.push([Math.abs(b.top + b.height / 2 - vh / 2) + Math.abs(b.left + b.width / 2 - vw / 2), k]);
    });
    const now = Date.now();
    if (add.length && now - (this._last || 0) > 450) { add.sort((a, b) => a[0] - b[0]); next[add[0][1]] = true; this._last = now; }
    const a = Object.keys(on), b = Object.keys(next);
    if (a.length !== b.length || b.some((k) => !on[k])) this.setState({ on: next });
  }
  renderVals() {
    const S = [['01','Loading','loading','Skeleton. Only shown when a load takes longer than 200 ms.'],['02','No Winnies yet','empty','First sign-in. Leads straight to Create Winnie.'],['03','No Challenges','no-challenges','A fresh Winnie. The add row is the next step.'],['04','Mid-run','mid-run','P0 sample data, Elden Ring running.'],['05','Everything paused','paused','Total Timer paused, faces asleep.'],['06a','Inline edit · rename Winnie','rename','Click the title. Enter saves, Esc cancels.'],['06b','Inline edit · Challenge','edit','Game, Win Condition, Target, Save / Cancel.'],['06c','Inline edit · field error','error','Empty game name on save.'],['07','Dragging mid-reorder','drag','Lifted row, ghosted drop slot, rows making room. Click anywhere to drop.'],['08a','Menu · Winnie picker','menu-picker','5 Winnies.'],['08b','Menu · Share','menu-share','Shared View and Overlay URLs with copy actions.'],['08c','Menu · Account','menu-account',''],['08d','Menu · Winnie overflow','menu-winnie',''],['08e','Menu · Challenge overflow','menu-challenge',''],['09','Limit reached','limit','50 / 50. Add row locked.'],['10','Complete','complete','All Won. Completion area reserves room for P6 statistics.'],['11','Toasts in context','toasts','Success, info, sticky error, offline.'],['12','Long content','long','~80-character game and win condition, 30-character Winnie name.']];
    return { rootRef: this.rootRef, states: S.map(([n, t, s, d]) => ({ n, t, s, d, label: n + ' ' + t, kl: n + 'l', kd: n + 'd', onL: !!this.state.on[n + 'l'], onD: !!this.state.on[n + 'd'], ph: s === 'limit' ? '5150px' : '1000px' })) };
  }
}
</script>
</body>
</html>
