<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#FFE3EC}.pane{padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--color-page);color:var(--color-text);font-family:var(--font-body)}.lbl{font:800 11px/1.2 var(--font-body);color:var(--color-text-muted)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr}code{font:700 11px/1.3 ui-monospace,Menlo,monospace;color:var(--color-text-muted)}.sw{display:flex;flex-direction:column;gap:4px;width:96px}.sw i{height:56px;border-radius:18px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}table{border-collapse:collapse;width:100%;font:600 12px/1.3 var(--font-body)}td,th{padding:5px 8px;text-align:left;border-bottom:1px solid var(--color-border)}th{font-weight:800;color:var(--color-text-muted)}</style></head><body class="w-root"><div class="grid2"><div class="pane" data-theme="light"><div class="row" style="gap:18px"><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><span style="width:110px;height:70px;border-radius:30px;background:var(--color-surface);box-shadow:var(--shadow-raised)"></span><code>shadow-raised</code></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><span style="width:110px;height:70px;border-radius:30px;background:var(--color-surface);box-shadow:var(--shadow-raised-lg)"></span><code>shadow-raised-lg</code></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><span style="width:110px;height:70px;border-radius:30px;background:var(--color-surface);box-shadow:var(--shadow-raised-hover)"></span><code>shadow-raised-hover</code></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><span style="width:110px;height:70px;border-radius:30px;background:var(--color-surface-sunken);box-shadow:var(--shadow-well)"></span><code>shadow-well</code></div></div><div class="row" style="gap:18px"><div class="w-card w-card--hero" style="width:150px;height:70px;padding:0;border-radius:30px"></div><code>grain + fingerprint (hero card)</code><span style="width:62px;height:70px;border-radius:24px;background:var(--texture-gloss),var(--color-pinned);box-shadow:0 8px 0 -1px var(--color-pinned-lip)"></span><code>gloss</code></div></div><div class="pane" data-theme="dark"><div class="row" style="gap:18px"><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><span style="width:110px;height:70px;border-radius:30px;background:var(--color-surface);box-shadow:var(--shadow-raised)"></span><code>shadow-raised</code></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><span style="width:110px;height:70px;border-radius:30px;background:var(--color-surface);box-shadow:var(--shadow-raised-lg)"></span><code>shadow-raised-lg</code></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><span style="width:110px;height:70px;border-radius:30px;background:var(--color-surface);box-shadow:var(--shadow-raised-hover)"></span><code>shadow-raised-hover</code></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><span style="width:110px;height:70px;border-radius:30px;background:var(--color-surface-sunken);box-shadow:var(--shadow-well)"></span><code>shadow-well</code></div></div><div class="row" style="gap:18px"><div class="w-card w-card--hero" style="width:150px;height:70px;padding:0;border-radius:30px"></div><code>grain + fingerprint (hero card)</code><span style="width:62px;height:70px;border-radius:24px;background:var(--texture-gloss),var(--color-pinned);box-shadow:0 8px 0 -1px var(--color-pinned-lip)"></span><code>gloss</code></div></div></div></body></html>
